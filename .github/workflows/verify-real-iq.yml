name: Verify acquired real IQ samples
on:
  push:
    paths:
      - 'scripts/verify_real_iq.py'
      - '.github/workflows/verify-real-iq.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python scripts/verify_real_iq.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-iq-measurement-audit
          path: real_iq_audit.json
          retention-days: 30
