name: Empirical radar acquisition and comparison
on:
  push:
    paths:
      - '.github/workflows/empirical-radar.yml'
      - 'scripts/empirical_radar.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.3 remotezip==0.12.3 numpy==2.2.6 scipy==1.15.3 h5py==3.14.0 scikit-learn==1.6.1
      - name: Inspect public measurement availability
        run: |
          python -u - <<'PY'
          import requests,json
          base='https://huggingface.co/api/datasets/AnonymousAuthors0018/sim2radar_artifacts'
          r=requests.get(base,timeout=30);r.raise_for_status()
          meta=r.json();print('HF_REVISION',meta.get('sha'))
          rows=meta.get('siblings',[])
          paths=[x['rfilename'] for x in rows]
          print('TOTAL_FILES',len(paths))
          selected=[x for x in paths if any(s in x.lower() for s in ['microbench','config','profile','readme','.json','.yaml','.lua'])]
          print('FILES',json.dumps(selected[:250]))
          for path in selected:
              if path.lower().endswith(('.json','.yaml','.lua','.cfg','.txt')) and 'config' in path.lower():
                  r=requests.get('https://huggingface.co/datasets/AnonymousAuthors0018/sim2radar_artifacts/resolve/'+meta['sha']+'/'+path,timeout=30)
                  print('CONFIG',path,r.status_code,r.text[:12000])
                  break
          url='https://drive.google.com/uc?export=download&id=1OfqXXgoFg6xRYZkRqPJye4cQ29Fomh3l'
          r=requests.get(url,headers={'Range':'bytes=0-1023'},stream=True,timeout=30)
          print('GAO_HTTP',r.status_code,'TYPE',r.headers.get('content-type'),'LENGTH',r.headers.get('content-length'))
          chunk=next(r.iter_content(2048),b'')
          if b'<html' in chunk.lower() or b'<!doctype' in chunk.lower():print('GAO_HTML',chunk.decode(errors='replace'))
          r.close()
          PY
