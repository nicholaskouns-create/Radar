name: Alternative real radar IQ acquisition
on:
  push:
    paths:
      - '.github/workflows/alternative-iq.yml'
      - 'scripts/acquire_alternative_iq.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/acquire_alternative_iq.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alternative-iq-acquisition
          path: acquisition_alternative.json
          retention-days: 30
