name: Research engine secure ingestion
on:
  workflow_dispatch:
  schedule:
    - cron: '31 13 * * 1'
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ingest versioned descriptive audit
        env:
          RESEARCH_ENGINE_SECRET_KEY: ${{ secrets.RESEARCH_ENGINE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEARCH_ENGINE_SERVICE_ROLE_KEY: ${{ secrets.RESEARCH_ENGINE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os,hashlib,json,base64,urllib.request
          key=(os.environ.get('RESEARCH_ENGINE_SECRET_KEY') or os.environ.get('SUPABASE_SECRET_KEY') or os.environ.get('RESEARCH_ENGINE_SERVICE_ROLE_KEY',''))
          if not key:
              print('BLOCKED: repository secret RESEARCH_ENGINE_SECRET_KEY not configured (SUPABASE_SECRET_KEY or legacy RESEARCH_ENGINE_SERVICE_ROLE_KEY also accepted). No insecure fallback.')
              raise SystemExit(2)
          artifact={'schema_version':'1.0','source':'ACICULA/mocap2radar',
                    'samples':14336,'measured_auc':None,'evidence_level':'real_iq_descriptive'}
          artifact['workflow_commit']=os.environ['GITHUB_SHA']
          artifact['workflow_run']=os.environ['GITHUB_RUN_ID']
          artifact['workflow_attempt']=os.environ['GITHUB_RUN_ATTEMPT']
          raw=json.dumps(artifact,sort_keys=True).encode()
          body={'run_id':'radar-acicula-audit-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],'dataset_id':'acicula-iq-v3',
                'producer':'Radar','algorithm':'iq-audit',
                'algorithm_version':'680c359915d26dce5cd8bed92014619982c3aad5',
                'evidence_level':'real_iq_descriptive','labels_verified':False,
                'phase_preserved':True,'result':{'samples':14336,'measured_auc':None},
                'artifact_sha256':hashlib.sha256(raw).hexdigest(),
                'artifact_base64':base64.b64encode(raw).decode()}
          url='https://gpkjvihkyectnenvnbng.supabase.co/functions/v1/research-engine-ingest'
          req=urllib.request.Request(url,data=json.dumps(body).encode(),
              headers={**({'apikey':key} if key.startswith('sb_secret_') else {'Authorization':'Bearer '+key}),
                       'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=35) as resp:
              output=json.load(resp)
          assert output.get('ok') is True
          print('Secure ingest verified:',output['run_id'],output['artifact_sha256'])
          PY
